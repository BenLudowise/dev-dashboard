<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Dev Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .login-box {
      background: #1e2130;
      padding: 40px;
      border-radius: 12px;
      width: 100%;
      max-width: 360px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      color: #ffffff;
    }

    p {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px;
      background: #252836;
      border: 1px solid #2a2d3e;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 0.95rem;
      margin-bottom: 20px;
      outline: none;
    }

    input:focus {
      border-color: #4caf50;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #4caf50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #43a047;
    }

    .error {
      background: rgba(244,67,54,0.1);
      border: 1px solid #f44336;
      color: #f44336;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>⚡ Dev Dashboard</h1>
    <p>Sign in to continue</p>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <label>Username</label>
      <input type="text" name="username" autofocus>

      <label>Password</label>
      <input type="password" name="password">

      <button type="submit">Sign In</button>
    </form>
  </div>
</body>
</html>
