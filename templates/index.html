<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dev Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f1117;
      color: #e0e0e0;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 30px;
      color: #ffffff;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: #1e2130;
      border-radius: 12px;
      padding: 24px;
    }

    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 12px;
    }

    .card .value {
      font-size: 2.2rem;
      font-weight: bold;
    }

    .card .sub {
      font-size: 0.8rem;
      color: #666;
      margin-top: 6px;
    }

    .green { color: #4caf50; }
    .yellow { color: #ffb300; }
    .red { color: #f44336; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e2130;
      border-radius: 12px;
      overflow: hidden;
    }

    th {
      text-align: left;
      padding: 14px 16px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      background: #252836;
    }

    td {
      padding: 12px 16px;
      font-size: 0.9rem;
      border-top: 1px solid #2a2d3e;
    }

    h3 {
      margin-bottom: 14px;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <h1>⚡ Dev Dashboard</h1>

  <div class="cards">
    <div class="card">
      <h2>CPU Usage</h2>
      <div class="value" id="cpu">--</div>
      <div class="sub">percent used</div>
    </div>
    <div class="card">
      <h2>RAM Usage</h2>
      <div class="value" id="ram">--</div>
      <div class="sub" id="ram-sub">loading...</div>
    </div>
    <div class="card">
      <h2>Disk Usage</h2>
      <div class="value" id="disk">--</div>
      <div class="sub" id="disk-sub">loading...</div>
    </div>
  </div>

  <h3>Top Processes</h3>
  <table>
    <thead>
      <tr>
        <th>PID</th>
        <th>Name</th>
        <th>CPU %</th>
        <th>Memory %</th>
      </tr>
    </thead>
    <tbody id="processes"></tbody>
  </table>

  <script>
    function colorClass(percent) {
      if (percent < 60) return 'green';
      if (percent < 85) return 'yellow';
      return 'red';
    }

    function formatGB(bytes) {
      return (bytes / 1024 ** 3).toFixed(1) + ' GB';
    }

    async function fetchStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();

      const cpu = document.getElementById('cpu');
      cpu.textContent = data.cpu_percent + '%';
      cpu.className = 'value ' + colorClass(data.cpu_percent);

      const ram = document.getElementById('ram');
      ram.textContent = data.ram.percent + '%';
      ram.className = 'value ' + colorClass(data.ram.percent);
      document.getElementById('ram-sub').textContent =
        formatGB(data.ram.used) + ' / ' + formatGB(data.ram.total);

      const disk = document.getElementById('disk');
      disk.textContent = data.disk.percent + '%';
      disk.className = 'value ' + colorClass(data.disk.percent);
      document.getElementById('disk-sub').textContent =
        formatGB(data.disk.used) + ' / ' + formatGB(data.disk.total);
    }

    async function fetchProcesses() {
      const res = await fetch('/api/processes');
      const data = await res.json();
      const tbody = document.getElementById('processes');
      tbody.innerHTML = data.map(p => `
        <tr>
          <td>${p.pid}</td>
          <td>${p.name}</td>
          <td>${p.cpu_percent.toFixed(1)}%</td>
          <td>${p.memory_percent ? p.memory_percent.toFixed(1) : '0.0'}%</td>
        </tr>
      `).join('');
    }

    function refresh() {
      fetchStats();
      fetchProcesses();
    }

    refresh();
    setInterval(refresh, 5000); // auto-refresh every 5 seconds
  </script>

</body>
</html>
